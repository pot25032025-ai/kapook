<title>ลานพัทยา — เว็บท่องเที่ยวและเว็บบอร์ด</title>
<style>
  html, body { margin: 0; padding: 0; }
  #boot { font-family: system-ui, sans-serif; text-align: center; padding: 60px 20px; color: #6B7A85; }
  #err { display: none; font-family: monospace; white-space: pre-wrap; background: #FFF3F2;
         color: #B4362E; border: 1px solid #B4362E; margin: 20px; padding: 14px; border-radius: 8px; }
</style>

<body>
<div id="root"><div id="boot">กำลังโหลดลานพัทยา…</div></div>
<div id="err"></div>
<noscript><div id="boot">เว็บนี้ต้องเปิดใช้ JavaScript</div></noscript>
<script>
// แสดงข้อผิดพลาดบนหน้าจอ (แทนที่จะเป็นหน้าขาวเฉย ๆ)
function showErr(msg) {
  var el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = "เกิดข้อผิดพลาด:\n" + msg;
}
window.addEventListener("error", function (e) { showErr(e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
window.addEventListener("unhandledrejection", function (e) { showErr(String(e.reason)); });
if (!window.React || !window.ReactDOM || !window.Babel) {
  showErr("โหลดไลบรารีจากอินเทอร์เน็ตไม่สำเร็จ — เช็คการเชื่อมต่อแล้วรีเฟรชอีกครั้ง");
}

// ระบบบันทึกกระทู้ด้วย localStorage (เก็บแยกเครื่องใครเครื่องมัน)
if (!window.storage) {
  window.storage = {
    async get(key) {
      var v = localStorage.getItem("lanpattaya:" + key);
      if (v === null) throw new Error("key not found");
      return { key: key, value: v };
    },
    async set(key, value) {
      localStorage.setItem("lanpattaya:" + key, value);
      return { key: key, value: value };
    },
  };
}
</script>

const CATEGORIES = [
  { id: "general", label: "คุยทั่วไป", color: "#0E7C7B" },
  { id: "north", label: "เที่ยวเหนือ", color: "#8E4585" },
  { id: "sea", label: "ทะเล-เกาะ", color: "#3D5A80" },
  { id: "roadtrip", label: "โร้ดทริป", color: "#E07A2F" },
  { id: "qa", label: "ถาม-ตอบ", color: "#5B8C5A" },
];

const catOf = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];

const timeAgo = (ts) => {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "เมื่อสักครู่";
  if (m < 60) return `${m} นาทีที่แล้ว`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ชั่วโมงที่แล้ว`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} วันที่แล้ว`;
  return new Date(ts).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });
};

function TravelSite() {
  const [threads, setThreads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("home"); // home | article | board | new | thread
  const [activeArticle, setActiveArticle] = useState(null);
  const [activeThread, setActiveThread] = useState(null);
  const [filter, setFilter] = useState("all");
  const [saving, setSaving] = useState(false);

  // ฟอร์มตั้งกระทู้
  const [fName, setFName] = useState("");
  const [fCat, setFCat] = useState("general");
  const [fTitle, setFTitle] = useState("");
  const [fBody, setFBody] = useState("");
  const [formError, setFormError] = useState("");

  // ฟอร์มตอบกระทู้
  const [rName, setRName] = useState("");
  const [rBody, setRBody] = useState("");
  const [replyError, setReplyError] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY, true);
        if (result && result.value) setThreads(JSON.parse(result.value));
      } catch (e) {
        // ยังไม่มีข้อมูล — เริ่มจากบอร์ดว่าง
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = async (next) => {
    setSaving(true);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(next), true);
    } catch (e) {
      console.error("บันทึกไม่สำเร็จ", e);
    } finally {
      setSaving(false);
    }
  };

  const createThread = async () => {
    if (!fName.trim() || !fTitle.trim() || !fBody.trim()) {
      setFormError("กรอกชื่อ หัวข้อ และเนื้อหาให้ครบก่อนโพสต์");
      return;
    }
    const t = {
      id: `t_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      author: fName.trim(),
      category: fCat,
      title: fTitle.trim(),
      body: fBody.trim(),
      createdAt: Date.now(),
      replies: [],
    };
    const next = [t, ...threads];
    setThreads(next);
    await persist(next);
    setFTitle(""); setFBody(""); setFormError("");
    setActiveThread(t.id);
    setView("thread");
  };

  const addReply = async () => {
    if (!rName.trim() || !rBody.trim()) {
      setReplyError("กรอกชื่อและข้อความก่อนส่งคำตอบ");
      return;
    }
    const next = threads.map((t) =>
      t.id === activeThread
        ? {
            ...t,
            replies: [
              ...t.replies,
              { id: `r_${Date.now()}`, author: rName.trim(), body: rBody.trim(), createdAt: Date.now() },
            ],
          }
        : t
    );
    setThreads(next);
    await persist(next);
    setRBody(""); setReplyError("");
  };

  const goTop = () => window.scrollTo({ top: 0, behavior: "auto" });
  const openArticle = (id) => { setActiveArticle(id); setView("article"); goTop(); };
  const openBoard = () => { setView("board"); goTop(); };
  const openHome = () => { setView("home"); goTop(); };

  const shown = filter === "all" ? threads : threads.filter((t) => t.category === filter);
  const current = threads.find((t) => t.id === activeThread);
  const article = ARTICLES.find((a) => a.id === activeArticle);

  const S = styles;
  const navItem = (label, active, onClick) => (
    <button style={{ ...S.navLink, ...(active ? S.navActive : {}) }} onClick={onClick}>
      {label}
    </button>
  );

  return (
    <div style={S.page}>
      <style>{`
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
          outline: 3px solid #F2A93B; outline-offset: 2px;
        }
        textarea, input, select { font-family: inherit; }
      `}</style>

      {/* ── หัวเว็บ ── */}
      <header style={S.header}>
        <div style={S.headerInner}>
          <button style={S.logoBtn} onClick={openHome}>
            <span style={S.logoMark}>ลาน</span>
            <span style={S.logoText}>พัทยา</span>
          </button>
          <nav style={S.nav}>
            {navItem("หน้าแรก", view === "home", openHome)}
            {navItem("บทความ", view === "article", () => openArticle(ARTICLES[0].id))}
            {navItem("เว็บบอร์ด", ["board", "new", "thread"].includes(view), openBoard)}
          </nav>
        </div>
      </header>

      <main style={S.main}>
        {view === "home" && (
          /* ── หน้าแรก ── */
          <div>
            <button style={S.hero} onClick={() => openArticle("southern-sea")}>
              <img src={IMG[9]} alt="หมู่เกาะอ่างทองจากมุมสูง" style={S.heroImg} />
              <div style={S.heroOverlay}>
                <span style={S.heroTag}>บทความเด่น</span>
                <h1 style={S.heroTitle}>ทะเลใต้สามอารมณ์ เกาะ หิน และผืนน้ำสีเขียว</h1>
                <p style={S.heroSub}>อ่างทอง เชี่ยวหลาน และสะพานไม้เหนือน้ำใส ในทริปเดียว</p>
              </div>
            </button>

            <h2 style={S.sectionHead}>บทความท่องเที่ยว</h2>
            <div style={S.grid}>
              {ARTICLES.map((a) => (
                <button key={a.id} style={S.card} onClick={() => openArticle(a.id)}>
                  <img src={IMG[a.cover]} alt="" style={S.cardImg} />
                  <div style={S.cardBody}>
                    <span style={S.cardTag}>{a.tag}</span>
                    <div style={S.cardTitle}>{a.title}</div>
                  </div>
                </button>
              ))}
            </div>

            <div style={S.boardPromo}>
              <div>
                <div style={S.promoTitle}>มีทริปเด็ดอยากเล่า หรือมีคำถามอยากถาม?</div>
                <div style={S.promoSub}>แวะมาตั้งกระทู้แลกเปลี่ยนกันได้ที่เว็บบอร์ด</div>
              </div>
              <button style={S.primaryBtn} onClick={openBoard}>ไปเว็บบอร์ด</button>
            </div>
          </div>
        )}

        {view === "article" && article && (
          /* ── หน้าบทความ ── */
          <div>
            <article style={S.articleWrap}>
              <span style={{ ...S.tag, background: "#0E7C7B" }}>{article.tag}</span>
              <h1 style={S.articleTitle}>{article.title}</h1>
              <p style={S.articleIntro}>{article.intro}</p>
              {article.sections.map((sec, i) => (
                <section key={i}>
                  <figure style={S.figure}>
                    <img src={IMG[sec.img]} alt={sec.alt} style={S.articleImg} />
                    <figcaption style={S.figcaption}>{sec.alt}</figcaption>
                  </figure>
                  <p style={S.body}>{sec.text}</p>
                </section>
              ))}
            </article>

            <h2 style={S.sectionHead}>อ่านต่อ</h2>
            <div style={S.grid}>
              {ARTICLES.filter((a) => a.id !== article.id).map((a) => (
                <button key={a.id} style={S.card} onClick={() => openArticle(a.id)}>
                  <img src={IMG[a.cover]} alt="" style={S.cardImg} />
                  <div style={S.cardBody}>
                    <span style={S.cardTag}>{a.tag}</span>
                    <div style={S.cardTitle}>{a.title}</div>
                  </div>
                </button>
              ))}
            </div>

            <div style={S.boardPromo}>
              <div>
                <div style={S.promoTitle}>เคยไปที่นี่มาแล้ว? เล่าให้เพื่อน ๆ ฟังหน่อย</div>
                <div style={S.promoSub}>ตั้งกระทู้รีวิวทริปของคุณได้ที่เว็บบอร์ด</div>
              </div>
              <button style={S.primaryBtn} onClick={() => { setView("new"); goTop(); }}>ตั้งกระทู้เลย</button>
            </div>
          </div>
        )}

        {["board", "new", "thread"].includes(view) && loading && (
          <div style={S.empty}>กำลังเปิดบอร์ด…</div>
        )}

        {view === "thread" && !loading && current && (
          /* ── หน้ากระทู้ ── */
          <div>
            <button style={S.backBtn} onClick={openBoard}>← กลับหน้าบอร์ด</button>
            <article style={S.threadCard}>
              <span style={{ ...S.tag, background: catOf(current.category).color }}>
                {catOf(current.category).label}
              </span>
              <h1 style={S.threadTitle}>{current.title}</h1>
              <div style={S.meta}>
                โดย <strong>{current.author}</strong> · {timeAgo(current.createdAt)}
              </div>
              <p style={S.body}>{current.body}</p>
            </article>

            <h2 style={S.sectionHead}>
              ความคิดเห็น {current.replies.length > 0 && `(${current.replies.length})`}
            </h2>
            {current.replies.length === 0 ? (
              <div style={S.emptySmall}>ยังไม่มีใครตอบ — เป็นคนแรกได้เลย</div>
            ) : (
              current.replies.map((r, i) => (
                <div key={r.id} style={S.replyCard}>
                  <div style={S.replyNum}>#{i + 1}</div>
                  <div style={{ flex: 1 }}>
                    <div style={S.meta}><strong>{r.author}</strong> · {timeAgo(r.createdAt)}</div>
                    <p style={{ ...S.body, marginBottom: 0 }}>{r.body}</p>
                  </div>
                </div>
              ))
            )}

            <div style={S.formCard}>
              <h3 style={S.formHead}>ร่วมตอบกระทู้</h3>
              <input
                style={S.input}
                placeholder="ชื่อที่ใช้แสดง"
                value={rName}
                onChange={(e) => setRName(e.target.value)}
                maxLength={40}
              />
              <textarea
                style={{ ...S.input, minHeight: 90, resize: "vertical" }}
                placeholder="พิมพ์ความคิดเห็น…"
                value={rBody}
                onChange={(e) => setRBody(e.target.value)}
                maxLength={2000}
              />
              {replyError && <div style={S.error}>{replyError}</div>}
              <button style={S.primaryBtn} onClick={addReply} disabled={saving}>
                {saving ? "กำลังส่ง…" : "ส่งคำตอบ"}
              </button>
            </div>
          </div>
        )}

        {view === "new" && !loading && (
          /* ── หน้าตั้งกระทู้ ── */
          <div>
            <button style={S.backBtn} onClick={openBoard}>← กลับหน้าบอร์ด</button>
            <div style={S.formCard}>
              <h2 style={S.formHead}>ตั้งกระทู้ใหม่</h2>
              <label style={S.label}>ชื่อที่ใช้แสดง</label>
              <input style={S.input} value={fName} onChange={(e) => setFName(e.target.value)} maxLength={40} placeholder="เช่น สมชาย" />
              <label style={S.label}>หมวด</label>
              <select style={S.input} value={fCat} onChange={(e) => setFCat(e.target.value)}>
                {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
              <label style={S.label}>หัวข้อกระทู้</label>
              <input style={S.input} value={fTitle} onChange={(e) => setFTitle(e.target.value)} maxLength={120} placeholder="เช่น รีวิวทริปดอยผาตั้ง 2 วัน 1 คืน" />
              <label style={S.label}>เนื้อหา</label>
              <textarea
                style={{ ...S.input, minHeight: 140, resize: "vertical" }}
                value={fBody}
                onChange={(e) => setFBody(e.target.value)}
                maxLength={4000}
                placeholder="เล่าทริปหรือถามคำถามได้เลย…"
              />
              {formError && <div style={S.error}>{formError}</div>}
              <button style={S.primaryBtn} onClick={createThread} disabled={saving}>
                {saving ? "กำลังโพสต์…" : "โพสต์กระทู้"}
              </button>
            </div>
          </div>
        )}

        {view === "board" && !loading && (
          /* ── หน้ารายการกระทู้ ── */
          <div>
            <h1 style={S.pageTitle}>เว็บบอร์ดนักเดินทาง</h1>
            <div style={S.toolbar}>
              <div style={S.filters}>
                <button
                  style={{ ...S.filterBtn, ...(filter === "all" ? S.filterActive : {}) }}
                  onClick={() => setFilter("all")}
                >ทั้งหมด</button>
                {CATEGORIES.map((c) => (
                  <button
                    key={c.id}
                    style={{
                      ...S.filterBtn,
                      ...(filter === c.id ? { background: c.color, color: "#fff", borderColor: c.color } : {}),
                    }}
                    onClick={() => setFilter(c.id)}
                  >{c.label}</button>
                ))}
              </div>
              <button style={S.primaryBtn} onClick={() => setView("new")}>+ ตั้งกระทู้</button>
            </div>

            {shown.length === 0 ? (
              <div style={S.empty}>
                {threads.length === 0
                  ? "บอร์ดยังว่างอยู่ — กด “ตั้งกระทู้” เพื่อเริ่มบทสนทนาแรก"
                  : "ยังไม่มีกระทู้ในหมวดนี้"}
              </div>
            ) : (
              shown.map((t) => (
                <button
                  key={t.id}
                  style={S.listItem}
                  onClick={() => { setActiveThread(t.id); setView("thread"); goTop(); }}
                >
                  <span style={{ ...S.tag, background: catOf(t.category).color }}>
                    {catOf(t.category).label}
                  </span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={S.listTitle}>{t.title}</div>
                    <div style={S.meta}>โดย {t.author} · {timeAgo(t.createdAt)}</div>
                  </div>
                  <div style={S.replyCount}>
                    <div style={S.replyCountNum}>{t.replies.length}</div>
                    <div style={S.replyCountLabel}>ตอบ</div>
                  </div>
                </button>
              ))
            )}
          </div>
        )}
      </main>

      <footer style={S.footer}>
        กระทู้ทั้งหมดถูกบันทึกแบบสาธารณะ ทุกคนที่เปิดเว็บนี้จะเห็นข้อความของคุณ
      </footer>
    </div>
  );
}

  },
  header: {
    background: "#22303A",

    position: "sticky",
    top: 0,
    zIndex: 10,

  headerInner: {
    maxWidth: 860,
    margin: "0 auto",
    padding: "14px 20px",
    display: "flex",
    alignItems: "center",
    justifyContent: "space-between",
    flexWrap: "wrap",
    gap: 10,
  },
  logoBtn: {
    background: "none", border: "none", cursor: "pointer", padding: 0,
    display: "inline-flex", alignItems: "baseline", gap: 2,
  },
  logoMark: { fontSize: 30, fontWeight: 800, color: "#F2A93B", letterSpacing: "-1px", lineHeight: 1 },
  logoText: { fontSize: 30, fontWeight: 800, color: "#FFFFFF", letterSpacing: "-1px", lineHeight: 1 },
  nav: { display: "flex", gap: 6 },
  navLink: {
    background: "none", border: "none", color: "#9DB2BF", fontSize: 15,

  navActive: { color: "#22303A", background: "#F2A93B" },
  main: { maxWidth: 860, margin: "0 auto", padding: "24px 20px 40px" },
  pageTitle: { fontSize: 26, fontWeight: 800, margin: "0 0 18px" },
